name: Release browser extensions

on:
  push:
    tags:
      - "extension-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Extension version, for example 0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

env:
  EXTENSION_FLAVOR: ${{ vars.EXTENSION_FLAVOR || 'crikket-community' }}
  EXTENSION_NAME: ${{ vars.EXTENSION_NAME || 'Crikket Community' }}
  EXTENSION_SHORT_NAME: ${{ vars.EXTENSION_SHORT_NAME || 'Crikket CE' }}
  FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID || 'crikket-community@yan-ad.github.io' }}
  SAFARI_APP_NAME: ${{ vars.SAFARI_APP_NAME || 'Crikket Community' }}
  SAFARI_BUNDLE_IDENTIFIER: ${{ vars.SAFARI_BUNDLE_IDENTIFIER || 'io.github.yan-ad.crikket-community' }}
  VITE_APP_URL: ${{ vars.EXTENSION_APP_URL || 'https://app.crikket.io' }}
  VITE_SERVER_URL: ${{ vars.EXTENSION_SERVER_URL || 'https://api.crikket.io' }}

jobs:
  package:
    name: Build extension packages
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Resolve release version
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#extension-v}"
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="${DISPATCH_VERSION#v}"
            TAG="extension-v${VERSION}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid extension version: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set extension version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          bun -e '
            const path = "apps/extension/package.json";
            const pkg = await Bun.file(path).json();
            pkg.version = process.env.VERSION;
            await Bun.write(path, `${JSON.stringify(pkg, null, 2)}\n`);
          '

      - name: Type-check extension
        run: bun run --filter extension check-types

      - name: Build browser packages
        run: |
          bun run --filter extension zip
          bun run --filter extension zip:firefox
          bun run --filter extension zip:safari

      - name: Prepare release assets
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p release-assets
          cp "apps/extension/.output/extension-${VERSION}-chrome.zip" \
            "release-assets/${EXTENSION_FLAVOR}-${VERSION}-chrome.zip"
          cp "apps/extension/.output/extension-${VERSION}-firefox.zip" \
            "release-assets/${EXTENSION_FLAVOR}-${VERSION}-firefox.zip"
          cp "apps/extension/.output/extension-${VERSION}-safari.zip" \
            "release-assets/${EXTENSION_FLAVOR}-${VERSION}-safari-webextension.zip"

          mkdir -p .release-source
          git archive HEAD | tar -x -C .release-source
          cp apps/extension/package.json .release-source/apps/extension/package.json
          (
            cd .release-source
            zip -qr "../release-assets/${EXTENSION_FLAVOR}-${VERSION}-firefox-sources.zip" .
          )

          sha256sum release-assets/*.zip > release-assets/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-${{ steps.release.outputs.version }}
          path: release-assets/*
          if-no-files-found: error

  package-safari-app:
    name: Build unsigned Safari app
    needs: package
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set extension version
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          bun -e '
            const path = "apps/extension/package.json";
            const pkg = await Bun.file(path).json();
            pkg.version = process.env.VERSION;
            await Bun.write(path, `${JSON.stringify(pkg, null, 2)}\n`);
          '

      - name: Generate Safari Xcode project
        run: bun run --filter extension package:safari

      - name: Build unsigned macOS app
        id: safari
        run: |
          PROJECT="$(find apps/extension/.output/safari-xcode -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "Safari Xcode project was not generated" >&2
            exit 1
          fi

          SCHEME="$(xcodebuild -project "$PROJECT" -list -json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          schemes = data.get("project", {}).get("schemes", [])
          preferred = next((scheme for scheme in schemes if "macOS" in scheme), None)
          if not preferred and schemes:
              preferred = schemes[0]
          if not preferred:
              raise SystemExit("No Xcode scheme found")
          print(preferred)
          ')"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/safari-derived-data" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP="$(find "$RUNNER_TEMP/safari-derived-data/Build/Products/Release" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "Unsigned Safari app was not produced" >&2
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Prepare Safari app artifacts
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          mkdir -p safari-release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ steps.safari.outputs.app }}" \
            "safari-release-assets/${EXTENSION_FLAVOR}-${VERSION}-safari-unsigned-app.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            apps/extension/.output/safari-xcode \
            "safari-release-assets/${EXTENSION_FLAVOR}-${VERSION}-safari-xcode-project.zip"
          shasum -a 256 safari-release-assets/*.zip \
            > safari-release-assets/SAFARI-SHA256SUMS.txt

      - name: Upload Safari workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safari-app-${{ needs.package.outputs.version }}
          path: safari-release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs:
      - package
      - package-safari-app
    runs-on: ubuntu-latest

    steps:
      - name: Download browser extension artifacts
        uses: actions/download-artifact@v4
        with:
          name: browser-extension-${{ needs.package.outputs.version }}
          path: release-assets

      - name: Download Safari app artifacts
        uses: actions/download-artifact@v4
        with:
          name: safari-app-${{ needs.package.outputs.version }}
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.package.outputs.tag }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$TAG" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Crikket Community Extension v${VERSION}"
          else
            gh release create "$TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "Crikket Community Extension v${VERSION}"
          fi
