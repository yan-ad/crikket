name: Publish Packages

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Type publish to release packages to npm"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-packages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK dependencies
        run: bun x turbo run build --filter=@crikket/capture-core --filter=@crikket-io/capture --filter=@crikket-io/capture-angular

      - name: Validate capture package
        if: github.event_name == 'pull_request'
        working-directory: sdks/capture
        run: npm pack --dry-run

      - name: Validate Angular package
        if: github.event_name == 'pull_request'
        working-directory: sdks/capture-angular
        run: npm pack --dry-run

      - name: Confirm npm publish
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          if [ "$CONFIRM_PUBLISH" != "publish" ]; then
            echo "Publishing cancelled: confirm_publish must equal 'publish'." >&2
            exit 1
          fi

      - name: Publish packages
        if: github.event_name == 'workflow_dispatch'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run changeset:publish
